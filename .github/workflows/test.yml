name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-mock
        # Mock pysystemtrade for CI if not installing full git repo
        pip install git+https://github.com/robcarver17/pysystemtrade.git
    - name: Run tests
      run: |
        # Airflow tests need a bit of setup or to be skipped in CI if no DB
        export AIRFLOW_HOME=$(pwd)/airflow
        airflow db migrate
        python -m pytest -k "not test_dag_structure"
