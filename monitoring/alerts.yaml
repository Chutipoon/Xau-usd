groups:
  - name: xauusd_trading_alerts
    rules:
      - alert: OHLCVDataStale
        expr: |
          (time() - max(ohlcv_xauusd_last_timestamp_seconds)) > 7200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OHLCV data lag > 2 hours"

      - alert: BridgeForecastStale
        expr: |
          (time() - max(signals_last_timestamp_seconds)) > 86400
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Bridge forecast unchanged for 24h"

      - alert: SignalsTableEmpty
        expr: |
          (time() - max(signals_last_timestamp_seconds)) > 28800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No new signals for 8 hours"

notification_channels:
  - name: slack_alerts
    type: slack
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      channel: "#xauusd-alerts"

  - name: email_critical
    type: email
    settings:
      addresses: "ops@example.com"
